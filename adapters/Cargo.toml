[package]
name = "swapsite-adapters"
description = "Node transports and on-disk state for the swap tooling"
version.workspace = true
edition.workspace = true
license.workspace = true

# Everything in this crate does real I/O: docker, HTTP, the filesystem. It is
# deliberately kept out of `swapsite-core`, which stays pure so it can compile
# to WASM for the browser-side taker signer.

[dependencies]
swapsite-core = { path = "../core" }
bitcoin.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
hex.workspace = true
