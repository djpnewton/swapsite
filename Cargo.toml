[workspace]
resolver = "2"
members = ["core", "adapters", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bitcoin = { version = "0.32", features = ["rand-std", "serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"

[profile.release]
lto = true
