[package]
name = "swapsite-cli"
description = "Command line tools: swapx and the maker daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
# Binaries are declared explicitly below.
autobins = false

[dependencies]
swapsite-core = { path = "../core" }
swapsite-adapters = { path = "../adapters" }
bitcoin.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true

[[bin]]
name = "swapx"
path = "src/bin/swapx.rs"

[[bin]]
name = "maker"
path = "src/bin/maker.rs"
